<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Case Opening Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1>CS2 Case Opening</h1>
        <p>Vyber si case, otevři ji a sleduj, jak se vygeneruje skin s floatem a rarity.</p>
      </div>
      <div class="case-meta" id="selected-case-meta"></div>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Vyber case</h2>
        <div id="case-list" class="case-list"></div>
      </section>

      <section class="panel">
        <div class="case-preview">
          <div class="case-model" id="case-model">
            <div class="case-box" id="case-box">
              <div class="case-face front glow" id="case-face">Case</div>
            </div>
          </div>

          <div>
            <h2 class="case-name" id="selected-case-name">Horizon Case</h2>
            <p class="case-desc" id="selected-case-desc">Vyber case a klikni na otevřít.</p>
            <div class="case-meta">
              <div>Počet položek: <span id="selected-case-items">0</span></div>
              <div>Nejlepší rarity: <span id="selected-case-best">Covert, Classified</span></div>
            </div>
            <button id="open-case" class="primary-button">Otevřít case</button>
          </div>
        </div>

        <div class="case-description-list" id="case-item-list"></div>
      </section>
    </main>

    <section class="panel result-panel">
      <h2>Výsledek</h2>
      <div id="result-container" class="result-container">Zatím žádné otevření.</div>
    </section>
  </div>

  <script src="case-opening.js"></script>
</body>
</html>
